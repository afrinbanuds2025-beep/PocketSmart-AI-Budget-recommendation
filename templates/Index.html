<!DOCTYPE html>
<html><body>
<h1>PocketSmart Budget</h1>
<form method="post">
Income: <input name="income" type="number"><br><br>
Rent: <input name="rent" type="number"><br><br>
Food: <input name="food" type="number"><br><br>
Transport: <input name="transport" type="number"><br><br>
<button type="submit">Check Budget</button>
</form>
{% if result %}
<p>Savings: {{ result.savings }}</p>
<h3>{{ result.advice }}</h3>
{% endif %}
</body></html>
