<!DOCTYPE html>
<html>
<head>
<title>PocketSmart - AI Budget</title>
<style>
body { font-family: Arial; background: linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; display:flex; justify-content:center; align-items:center; margin:0; }
.card { background:white; padding:30px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.3); width:350px; }
h1 { color:#667eea; text-align:center; }
input { width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:8px; }
button { width:100%; background:#667eea; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; font-size:16px; font-weight:bold; }
button:hover { background:#5a67d8; }
.result { margin-top:20px; padding:15px; border-radius:8px; background:#f0fff4; border-left:5px solid #38a169; }
.savings { font-size:20px; font-weight:bold; color:#2d3748; }
</style>
</head>
<body>
<div class="card">
<h1>💰 PocketSmart Budget</h1>
<form method="POST">
<label>Income (Rs.)</label>
<input type="number" name="income" placeholder="Ex: 100000" required>
<label>Rent (Rs.)</label>
<input type="number" name="rent" placeholder="Ex: 30000" required>
<label>Food (Rs.)</label>
<input type="number" name="food" placeholder="Ex: 20000" required>
<label>Transport (Rs.)</label>
<input type="number" name="transport" placeholder="Ex: 10000" required>
<button type="submit">Check Budget ✨</button>
</form>
{% if result %}
<div class="result">
<p class="savings">{{ result }}</p>
<p><b>Total Savings: Rs.{{ savings }}</b></p>
</div>
{% endif %}
</div>
</body>
</html>
